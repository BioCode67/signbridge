# Render 배포 정의 (Blueprint). 저장소를 Render에 연결하면 이 파일대로 만들어진다.
#
# ⚠️ **플랜을 반드시 확인할 것.** KoBART(text2gloss)는 fp32 가중치만 475MB라
# 프로세스 상주 메모리가 1GB를 넘는다. Render free·starter는 512MB라 무조건 OOM이다.
# `standard`(2GB) 이상이어야 뜬다. 무료로 쓰려면 아래 "대안" 참고.
#
# 모델·동작사전은 저장소에 없다(수 GB). 배포 전에 어딘가에 올리고 URL을 넣어야 한다:
#   T2G_MODEL_URL   KoBART best 디렉터리를 tar.gz로 묶은 것
#   GLOSS_BANK_URL  글로스 동작 사전을 tar.gz로 묶은 것
# server/fetch_assets.py가 시작 시 내려받아 푼다.
#
# 대안(권장): Hugging Face Spaces는 무료 티어가 2vCPU·16GB RAM이라 이 모델에 여유롭다.
# 같은 server/app.py를 그대로 쓰고, 모델은 HF 저장소에 두면 다운로드도 빠르다.

services:
  # ── AI 백엔드 (텍스트→글로스→아바타 동작) ──────────────────────────────
  - type: web
    name: signbridge-api
    runtime: python
    plan: standard # ← free/starter(512MB)는 KoBART가 올라가지 않는다
    region: singapore # 한국에서 가장 가까운 리전
    buildCommand: pip install -r server/requirements-deploy.txt
    startCommand: python server/fetch_assets.py && uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: T2G_MODEL
        value: /tmp/assets/t2g-best
      - key: GLOSS_BANK
        value: /tmp/assets/glossbank
      - key: T2G_MODEL_URL
        sync: false # 대시보드에서 직접 입력
      - key: GLOSS_BANK_URL
        sync: false

  # ── 프런트엔드 (정적) ────────────────────────────────────────────────
  # GitHub Pages 대신 여기서 서빙해도 된다. VITE_API_URL이 위 서비스를 가리키게 한다.
  - type: web
    name: signbridge-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://signbridge-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
